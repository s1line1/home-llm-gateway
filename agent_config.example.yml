# home-llm-gateway 边缘端 agent 配置示例
# 使用：cp agent_config.example.yml agent-config.yml，按需修改后
#       agent --config agent-config.yml
# 所有字段都有默认值；cloud_addr / ca / cert / key 为必填。

# 云端网关 QUIC 地址（IP:端口）— 必填（同地域可用内网 IP）
cloud_addr: "1.2.3.4:4433"

# 证书校验服务器名（须与网关证书 SAN 匹配）
server_name: "llm.example.com"

# 证书 — 必填（CA 单独为每台 agent 签发 client 证书）
ca: /etc/home-llm-gateway/ca.crt
cert: /etc/home-llm-gateway/client.crt
key: /etc/home-llm-gateway/client.key

# agent 标识（多台机器区分用）
agent_id: "home-1"

# 本地 LLM 的 OpenAI 兼容地址。必须是**不带路径的 http(s) origin**（启动时校验）：
# 请求路径会被直接拼在后面，所以这里写了路径就会前置到每个请求上；尾斜杠会被规范化掉
# （`…:8000/` 等价于 `…:8000`），而缺 scheme（`127.0.0.1:8000`）在启动时报错，
# 不会拖到第一个请求才以 502 暴露。
upstream: "http://127.0.0.1:8000"

# 心跳间隔秒数
heartbeat_secs: 5

# 声明的模型列表（edge 能力声明：网关按客户端请求的 model 路由到能服务它的 edge；
# `*` = 全匹配，但不会出现在网关 /v1/models 聚合列表里；应填本机实际能跑的模型名）
models:
  - qwen2.5

# 声明的最大并发请求数（网关据此做 admission control）。
# 两个约束：
#   ① 这是**声明**——agent 端没有信号量，不会自己拦；超了由网关按这个数字拒绝
#      （返回 429 "agent at capacity"），所以它是"告诉网关我能吃多少"。
#   ② 必须 ≤ 网关的 `max_open_tunnel_streams`（默认 1024）。声明超过网关的每连接流额度时，
#      多出来的请求会排在 **QUIC 流额度**上而不是容量上，表现为"隧道随机超时"→ 被摘除 →
#      重连期间全量 503；网关会在 agent 注册时打 WARN 提示（见 README《失败处理》）。
max_concurrency: 2

# 每请求转发日志开关（received/responded/done/cancelled）。
# 默认 true；高并发/压测时建议改为 false，避免日志刷屏（连接/注册等低频日志不受影响）。
request_log: true
