# home-llm-gateway 网关配置示例
# 使用：cp gateway_config.example.yml gateway-config.yml，按需修改后
#       gateway --config gateway-config.yml
# 所有字段都有默认值；cert / key / ca 为必填。

# listen_addr: "[::]:8080"
# quic_addr: "[::]:4433"

# HTTP(S) 公网入口监听地址（客户端连接入口，TCP）
listen_addr: "0.0.0.0:8443"

# QUIC 隧道监听地址（agent 拨入入口，UDP）
quic_addr: "0.0.0.0:4433"

# QUIC 隧道证书（服务端证书 + 私钥 + 签发 agent 客户端证书的 CA）— 必填
cert: /etc/home-llm-gateway/server.crt
key: /etc/home-llm-gateway/server.key
ca: /etc/home-llm-gateway/ca.crt

# Admin token（必须配置：所有 API Key 都通过 Admin API 运行时创建并存入 SQLite，
# 首次启动用它创建第一个 key。生成：openssl rand -hex 32）
admin_token: CHANGE_ME_admin_token

# 动态 API Key 持久化数据库（SQLite；null = 仅内存）
keys_file: /etc/home-llm-gateway/keys.db

# 单次转发空闲超时秒数（逐帧；SSE 长流不受影响）
# 语义：**响应体**阶段"两帧之间"的最大间隔。SSE 只要有帧来就不会超时，所以调大它
# 不会让长回答更安全，只会让"上游卡住"的请求多占住连接/并发槽位/缓冲区。
timeout_secs: 120

# 隧道「控制操作」超时秒数：打开流 + 发送请求头（+ 取消帧）。
# 健康隧道这两步是**毫秒级**（本机实测全部固定开销 ≈56ms），2s 已经极宽松。
# 超时即判定该 agent 的连接已死 → 摘掉注册表条目，请求快速失败（502），
# 而不是让后续每个请求都白等一次超时。
# 隧道控制操作（开流 / 发请求帧 / 取消帧）的限时。高并发下这些操作要排队过连接级
# 流管理器，值给小了会把"排队"误判成"连接已死"：条目被摘除但连接还开着、agent 毫不知情，
# 于是所有请求 503 而 agent 永不重连（僵尸态，实测 2s 时 503 占 92.6%）。
# 现在默认 10s，并且摘除需要**连续** 3 次超时（registry::TUNNEL_TIMEOUTS_BEFORE_EVICT），
# 摘除时同时关闭连接。实测 768 并发下 5s 仍有 5-7% 请求报 502（隧道操作超时）。
tunnel_op_secs: 10

# 等待上游**响应头**（首字节）的秒数。
# 与 timeout_secs 的区别很重要：上游"思考"多久是合法的（本地大模型 1–3s 很常见），
# 所以不能拿 tunnel_op_secs（10s）去卡它；但它也绝不该像 timeout_secs 那样等 120s
# —— agent 卡死（注册着但什么都不回）时，每个请求都会把连接、并发槽位和缓冲区
# 占满那么久（实测 40 并发钉住约 620MB、客户端早断开却无人发现）。
head_timeout_secs: 15

# 「响应头静默」判据的第二层：**对端还在说话时**，静默最多可以被宽限到多久（秒）。
# 背景：那条"忙/死"判据靠"最近有没有成功响应头"来分辨，而它的唯一刷新点就是成功响应头本身。
# 于是一旦**所有**请求都慢过 head_timeout_secs（大模型首字节慢、上游排队、链路被堵），
# 就没有任何一次成功能刷新它 → 窗口必然走完 → 一条活得好好的 agent 被摘除 → 关连接 →
# agent 重连 → 注册表为空 → 全量 503（2026-09-18 实测过一次）。
# 这一层用"对端还在发心跳"作为它活着的证据，把静默的容忍度延长到这里为止。
# 默认 120（= timeout_secs，语义是"一条请求的寿命"）：静默比一条请求活得还久、心跳却还在，
# 那更像**数据面卡死**，正是这条判据要抓的，所以给上界而不是"心跳还在就永不摘除"。
# **不能小于 4 × head_timeout_secs**，否则这一层不会生效。0 = 关掉这一层（回到"窗口一过就判死"）。
# 注意它不覆盖"从未回过响应头"的连接——那一支保持原来的快路径（注册后一个头都没回过，
# 就没有"它能服务"的证据），仍会在连续 3 次之后被摘除。
head_silent_grace_secs: 120

# 摘除一条连接后，等它在途请求收尾的**宽限秒数**；超过就强制关闭。
# 只在"摘除"这条路径上生效（连续 3 次同因隧道失败），不影响正常请求。
# 为什么它该与 head_timeout_secs 同量级：在途集合里既有"已送达上游、模型正在生成"的请求，
# 也有**仍在等响应头**的请求（槽位从取得一直持有到响应结束，覆盖整段响应头等待）。
# 默认与 head_timeout_secs 相同（15s，2026-09 由 5s 上调）：宽限短于 head_timeout_secs 时，
# 摘除会把还在合法等头的请求一起掐断（评估报告 §5 H1）。**配得比它小会在启动时打一条 WARN。**
# 也不能无限大：连接迟迟不关，agent 察觉不到自己被摘除，会退化成"自认为在线的僵尸"。
# 注意它仍远小于 timeout_secs(120s)：长回答在被摘除的连接上依然会被切断——这是本机制没有
# 消除的取舍，不是配置问题。
# 0 = 不等、立刻关。
evict_close_grace_secs: 15

# 客户端「完全停滞」多久就放弃（秒）：请求体读不动、或响应体客户端不消费。
#
# 为什么必须有：准入票据（`max_concurrent_requests` 那道闸）的释放挂在 Drop 上，
# 但**释放的前提是那个任务/连接能结束**。以前有三处客户端侧等待没有超时：
#   ① 读请求体（只发 headers、声明大 Content-Length 却不发 body 的客户端）；
#   ② 写响应体通道（读完响应头就不再读 socket 的客户端）；
#   ③ hyper 往 socket 写响应（同上，但卡在 hyper 内部，应用层修不到）。
# 三者都能让一个在途请求**永久**占住准入槽位。实测云端沉淀过 8 个这样的僵尸槽位：
# `hlmg_active_requests` 恒定 8 不再下降，而 `hlmg_request_count − Σ状态码 = 8` 精确对上；
# 这类槽位只增不减，配了闸门的网关会被慢慢吃光（生产口径约 32，8 个就是 25%），只能重启。
#
# 语义是**停滞**而不是**总时长**：该方向只要还有字节在动就不断续期——慢而持续的大 body
# 上传、弱网下逐块到达的 SSE 都不会被误杀；真正停住（一个字节都没有）才放弃。
# 与隧道侧逐帧空闲超时（`timeout_secs`，默认 120s）同量级且更短，避免"上游还在产出、
# 客户端已僵住"时白烧 token。
client_stall_secs: 60

# 公网入口并发连接数上限（0 = 不限，回到"只受 NOFILE 约束"）。
# 满额时**暂停 accept**：新连接留在内核 backlog 里排队，等有连接结束再进——
# 所以它是资源上限（防半开连接吃光 fd），不是限流闸；要限流请调 max_concurrent_requests。
max_entry_connections: 1024

# 关闭序列：① 停 accept（不再接新请求）② 等在途请求收尾 ③ 强制落库 ④ abort 任务。
# 本值 = ②的等待上限（秒）：到期仍有在途就记 WARN 并切断（长 SSE 会被截断）。
shutdown_grace_secs: 15

# = ③ 强制落库的等待上限（秒）：把已结算用量写一次 SQLite；超过就放弃等待、记 WARN 继续。
# systemd 单元的 TimeoutStopSec 必须 **大于** `shutdown_grace_secs + shutdown_flush_secs`，
# 否则还没走完就被 SIGKILL。
shutdown_flush_secs: 10

# agent 超过该秒数未心跳视为失联。它必须**明显大于** agent 的 `heartbeat_secs`（agent 默认
# 5s）：窗口里至少要容得下**两次**心跳，否则一次延迟就会把健康的 agent 判成失联——现象是
# 周期性 503/404，而两侧进程与注册表看着都正常。默认 15s 容得下三次。
# 启动时若判定偏紧，网关会打一条 WARN（**只提醒、不拒绝**：把窗口调小并同时调快所有 agent
# 的心跳是合法部署）。
agent_stale_secs: 15

# 已验证身份缓存的容量（条）。0 = 关闭缓存（每个请求都完整跑一次 argon2）。
#
# argon2 是内存硬的：默认 m=19456 KiB，**每次校验同时占 19MiB 工作内存**。
# 关闭缓存时内存峰值 ≈ `并发请求数 × 19MiB`（实测 100 字符流：8 并发 → 峰值 +144MB、
# 64 并发 → +1064MB 撞上 1G 上限、128 并发 → +1416MB 并被打爆 45% 失败）。
# 开启后（默认）走"缓存 + 单飞"：同一个 token 的并发请求只跑一次校验，
# 每请求只做 O(1) 的 enabled/凭据版本核对 —— 峰值降到 `同时首用的不同 token 数 × 19MiB`，
# 转发缓冲实测每请求仅约 0.2MB（64 并发峰值 +13MB）；
# 而**吊销依然即时生效**（版本不一致或记录消失立即拒绝，不依赖缓存过期）。
verified_cache_max: 1650

# 每个 API Key 每分钟请求上限（0 = 不限流）
rate_limit_per_min: 60

# HTTP 全局在途请求上限（0 = 不限；per-key 限流之外的总闸门）。
#
# 计数口径：所有路径的**在途 HTTP 请求**，每个计 1（只有 /metrics 豁免）；
# SSE 长流从开始占到位到最后一块 body 送完才归还。超限返回 429 + Retry-After。
#
# ⚠️ 这个值只在**缓存关闭**时才需要按内存倒推：那种情况下每个在途流式请求要吃掉
# 网关约 19MiB（argon2 工作内存，见 README《并发上限与内存》），所以：
#     max_concurrent_requests ≈ MemoryMax / 20MB，再留三成余量
# 例如 cgroup 上限 1G → 约 40，取 32。设得太大（如 100）时，先撞的会是
# MemoryMax 把网关 OOM 杀掉，而不是这里返回 429——那就失去了"优雅拒绝"的意义。
# **默认开启校验缓存后，网关内存不再随在途数线性增长**（云端实测：21 516 个请求、
# 峰值 7.5MB），这个值按业务量给即可，它就是一道防雪崩的总闸。
max_concurrent_requests: 32

# 每条 agent 连接允许**同时在途**的隧道流数（QUIC 双向流额度）。
#
# 为什么必须显式设置：s2n-quic 的 `initial_max_streams_bidi` 默认只有 **100**，
# 而实际可用额度取 `min(本地额度, 对端额度)`。agent 侧已经给了 1000，但网关自己的
# 本地额度从没设过 = 100 —— 于是一条 agent 连接最多只能有 100 条在途请求。超过之后
# `open_bidirectional_stream()` 只能**排队等额度回收**，上游一慢就排过 tunnel_op_secs，
# 被误判成"隧道已死" → 摘除**健康但繁忙**的 agent → 连接被关 → agent 重连 → 注册表
# 瞬间为空 → 其间所有请求 503。
# 实测（2026-09-17，云端 4 agent、768 并发）：`tunnel open timed out` 9345 次，
# 一次 30s 压测 `agent_rejections_total{reason="registry-empty"}` +6835。
#
# 取值必须 **≥ 每个 agent 声明的 max_concurrency**（agent 注册时若声明超过本值，网关会打 WARN）。
# 0 = 用默认值 1024。注意这只是**上限**：真正的在途量由注册表按 agent 的
# max_concurrency 做准入控制，所以给大不会放大并发，也不会放大内存。
max_open_tunnel_streams: 1024

# 公网入口 HTTPS 证书（提供后公网入口启用 TLS，客户端用 https:// 访问；
# 与 tls_key 成对，去掉即明文 HTTP）
# tls_cert: /etc/home-llm-gateway/server.crt
# tls_key: /etc/home-llm-gateway/server.key

# React Web UI 静态目录（含 index.html；浏览器打开网关地址 `/` 即管理面板）。
# **不写这一项 = 默认 `/usr/local/share/home-llm-gateway/web`**（`config.rs` 的
# `default_ui_dir()`）——那正是本仓库镜像把前端产物 COPY 进去的位置 ⇒ **容器部署不必写这一行**，
# 开箱即用；有配置就用配置。
# 反过来，**原生（systemd）部署要显式写**：默认值是给镜像用的绝对路径，宿主机上并不存在。
# 目录里没有**可用产物**时（没构建 / 路径写错 / 指向前端源码目录），`/` 显示构建提示页并说明
# 原因，进程照常启动（非致命降级）。
# 构建前端：cd web && pnpm install && pnpm build
#
# 下面给的是原生部署的写法，注意**相对路径按进程 CWD 解析**（`WorkingDirectory`），
# 所以要与实际目录层次一致：
#   · 产物落在 `<CWD>/web/dist/` ⇒ 写 `web/dist`（本文件这一行；DEPLOY.md §4 的上传方式）
#   · 产物落在 `<CWD>/web/`（例如 `scp -r web/dist <服务器>:/etc/home-llm-gateway/web`
#     这种**会把目录改名**的上传）⇒ 写 `web`
# 写错层次不会报错，只会静默降级成占位页（日志里那行 warn 会点名它实际找的路径）。
ui_dir: web/dist
