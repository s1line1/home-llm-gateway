[workspace]
resolver = "2"
members = ["crates/proto", "crates/gateway", "crates/agent", "crates/mock-llm"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
# 最低支持的编译器（MSRV）。**刻意声明我们真正验证过的版本**（见 `rust-toolchain.toml`
# 的 channel 与 `scripts/check-toolchain.sh`）：与其猜一个更低的数字，不如让更老的工具链
# 直接给出清晰报错，而不是一堆难解的类型错误。各成员用 `rust-version.workspace = true` 继承。
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
# bytes：帧里的 body/chunk。开 `serde` 是为了让 postcard 走 `serialize_bytes`（一次写整块）
# 而不是把 `Vec<u8>` 当序列**逐元素**编码——16MiB 上实测差三个数量级（见 proto/src/frame.rs）。
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
postcard = { version = "1", features = ["alloc"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# s2n-quic：默认 feature 走 s2n-tls（C 库）→ 显式关默认，只开 rustls provider；
# provider-address-token-default 顺带带出 crypto/zerocopy/zeroize（关默认后必须显式开）
s2n-quic = { version = "1.88", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal","io-std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
# time crate：日志时间戳固定东八区（UTC+8，无夏令时），不依赖系统时区设置
time = { version = "0.3", features = ["formatting"] }

[workspace.dependencies.criterion]
version = "0.8"
features = ["html_reports"]

# 统一的 Rust/clippy lint 策略（各 crate 通过 [lints] workspace = true 继承）
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
