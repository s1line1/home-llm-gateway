<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">home-llm-gateway architecture</title>
  <desc id="desc">Architecture diagram showing clients, cloud gateway modules, QUIC tunnel, edge agent, and local OpenAI-compatible LLM services.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#soft-shadow); }
      .panel-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .panel-sub { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .node-blue { fill: #eff6ff; stroke: #60a5fa; }
      .node-green { fill: #ecfdf5; stroke: #34d399; }
      .node-orange { fill: #fff7ed; stroke: #fb923c; }
      .node-red { fill: #fef2f2; stroke: #f87171; }
      .node-purple { fill: #f5f3ff; stroke: #a78bfa; }
      .node-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small-text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 4; marker-end: url(#arrow-green); }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 4; marker-end: url(#arrow-orange); }
      .flow-red { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-red); }
      .flow-muted { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow-blue); opacity: 0.75; }
      .chip { fill: #e2e8f0; rx: 9; }
      .chip-text { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .section-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1220"/>
  <text x="70" y="70" class="panel-title">home-llm-gateway 架构图</text>
  <text x="70" y="100" class="panel-sub">边缘 LLM 通过主动 QUIC 隧道接入公网网关，对外提供 OpenAI 兼容 API 与流式 SSE。</text>

  <rect class="panel" x="60" y="150" width="300" height="770"/>
  <text x="88" y="194" class="panel-title">调用方</text>
  <text x="88" y="222" class="panel-sub">公网侧入口</text>

  <rect class="node node-blue" x="92" y="270" width="236" height="124"/>
  <text x="126" y="312" class="node-title">客户端 / SDK</text>
  <text x="126" y="342" class="node-text">OpenAI 兼容 API</text>
  <text x="126" y="368" class="node-text">/v1/chat/completions</text>

  <rect class="node node-purple" x="92" y="456" width="236" height="124"/>
  <text x="126" y="498" class="node-title">管理员</text>
  <text x="126" y="528" class="node-text">React Dashboard</text>
  <text x="126" y="554" class="node-text">/admin/*</text>

  <rect class="node" x="92" y="642" width="236" height="124"/>
  <text x="126" y="684" class="node-title">Prometheus</text>
  <text x="126" y="714" class="node-text">抓取 /metrics</text>
  <text x="126" y="740" class="node-text">健康检查 /healthz</text>

  <rect class="panel" x="430" y="150" width="610" height="770"/>
  <text x="460" y="194" class="panel-title">cloud-gateway</text>
  <text x="460" y="222" class="panel-sub">Rust: axum + quinn + rustls + SQLite</text>

  <rect class="node node-blue" x="475" y="265" width="250" height="108"/>
  <text x="505" y="306" class="node-title">HTTP(S) 入口</text>
  <text x="505" y="334" class="node-text">/v1/* /admin/*</text>
  <text x="505" y="359" class="node-text">静态托管 web/dist</text>

  <rect class="node" x="772" y="265" width="220" height="108"/>
  <text x="802" y="306" class="node-title">Metrics</text>
  <text x="802" y="334" class="node-text">状态码 / 延迟</text>
  <text x="802" y="359" class="node-text">inflight / agent 数</text>

  <rect class="node node-green" x="475" y="435" width="250" height="112"/>
  <text x="505" y="475" class="node-title">认证与限流</text>
  <text x="505" y="504" class="node-text">Bearer API Key</text>
  <text x="505" y="529" class="node-text">token bucket + 并发闸门</text>

  <rect class="node node-orange" x="772" y="435" width="220" height="112"/>
  <text x="802" y="475" class="node-title">KeyStore</text>
  <text x="802" y="504" class="node-text">sha256 索引</text>
  <text x="802" y="529" class="node-text">argon2 + usage</text>

  <rect class="node node-green" x="475" y="610" width="250" height="128"/>
  <text x="505" y="649" class="node-title">模型路由 Registry</text>
  <text x="505" y="678" class="node-text">按 model 过滤 agent</text>
  <text x="505" y="703" class="node-text">精确优先，* 兜底</text>
  <text x="505" y="728" class="node-text">最少 inflight 负载均衡</text>

  <rect class="node node-blue" x="772" y="610" width="220" height="128"/>
  <text x="802" y="649" class="node-title">QUIC Server</text>
  <text x="802" y="678" class="node-text">UDP + TLS 1.3</text>
  <text x="802" y="703" class="node-text">mTLS 校验 agent</text>
  <text x="802" y="728" class="node-text">每请求一条 stream</text>

  <rect class="panel" x="1110" y="150" width="285" height="770"/>
  <text x="1140" y="194" class="panel-title">QUIC 隧道</text>
  <text x="1140" y="222" class="panel-sub">proto::Frame + postcard</text>

  <rect class="node node-green" x="1147" y="270" width="212" height="86"/>
  <text x="1172" y="306" class="small-title">Register</text>
  <text x="1172" y="331" class="small-text">agent_id / models / 并发上限</text>

  <rect class="node node-green" x="1147" y="394" width="212" height="86"/>
  <text x="1172" y="430" class="small-title">Heartbeat</text>
  <text x="1172" y="455" class="small-text">刷新 last_seen 健康状态</text>

  <rect class="node node-blue" x="1147" y="518" width="212" height="94"/>
  <text x="1172" y="554" class="small-title">ProxyRequest</text>
  <text x="1172" y="579" class="small-text">method / path / headers / body</text>

  <rect class="node node-orange" x="1147" y="650" width="212" height="108"/>
  <text x="1172" y="686" class="small-title">ProxyResponse*</text>
  <text x="1172" y="711" class="small-text">Head / Body chunk / End</text>
  <text x="1172" y="736" class="small-text">SSE 分块原样透传</text>

  <rect class="node node-red" x="1147" y="796" width="212" height="76"/>
  <text x="1172" y="830" class="small-title">Cancel</text>
  <text x="1172" y="854" class="small-text">断开或超时，取消上游</text>

  <rect class="panel" x="1465" y="150" width="275" height="770"/>
  <text x="1495" y="194" class="panel-title">edge-agent</text>
  <text x="1495" y="222" class="panel-sub">NAT 后主动拨号</text>

  <rect class="node node-blue" x="1494" y="270" width="218" height="110"/>
  <text x="1522" y="310" class="node-title">QUIC Client</text>
  <text x="1522" y="339" class="node-text">启动拨号</text>
  <text x="1522" y="364" class="node-text">断线指数退避重连</text>

  <rect class="node node-green" x="1494" y="440" width="218" height="118"/>
  <text x="1522" y="480" class="node-title">Stream Handler</text>
  <text x="1522" y="509" class="node-text">读取 ProxyRequest</text>
  <text x="1522" y="534" class="node-text">FrameReader 监听 Cancel</text>

  <rect class="node node-orange" x="1494" y="618" width="218" height="118"/>
  <text x="1522" y="658" class="node-title">reqwest 转发</text>
  <text x="1522" y="687" class="node-text">过滤逐跳头</text>
  <text x="1522" y="712" class="node-text">流式读取上游 body</text>

  <rect class="node node-purple" x="1494" y="796" width="218" height="76"/>
  <text x="1522" y="830" class="node-title">agent-config.yml</text>
  <text x="1522" y="855" class="node-text">models / upstream / cert</text>

  <rect class="panel" x="430" y="970" width="1310" height="105"/>
  <text x="460" y="1012" class="panel-title">本地 OpenAI 兼容 LLM</text>
  <rect class="chip" x="780" y="988" width="130" height="42"/>
  <text x="809" y="1014" class="chip-text">Ollama</text>
  <rect class="chip" x="940" y="988" width="130" height="42"/>
  <text x="979" y="1014" class="chip-text">vLLM</text>
  <rect class="chip" x="1100" y="988" width="170" height="42"/>
  <text x="1136" y="1014" class="chip-text">llama.cpp</text>
  <rect class="chip" x="1300" y="988" width="150" height="42"/>
  <text x="1332" y="1014" class="chip-text">mock-llm</text>
  <text x="460" y="1048" class="panel-sub">agent 把公网请求转为本地 HTTP /v1/*，上游响应再经 QUIC 分块回传。</text>

  <path class="flow-blue" d="M328 332 C380 332, 410 319, 475 319"/>
  <text x="365" y="302" class="label">HTTPS /v1/*</text>

  <path class="flow-muted" d="M328 518 C383 518, 410 336, 475 336"/>
  <text x="356" y="468" class="label">/admin/*</text>

  <path class="flow-muted" d="M328 704 C390 704, 405 356, 475 356"/>
  <text x="350" y="654" class="label">/metrics</text>

  <path class="flow-blue" d="M600 373 L600 435"/>
  <path class="flow-blue" d="M600 547 L600 610"/>
  <path class="flow-blue" d="M725 674 L772 674"/>
  <path class="flow-orange" d="M725 491 L772 491"/>
  <path class="flow-muted" d="M725 319 L772 319"/>
  <path class="flow-muted" d="M882 610 L882 547"/>

  <path class="flow-green" d="M1494 312 C1434 312, 1410 313, 1359 313"/>
  <text x="1375" y="291" class="label">Register</text>
  <path class="flow-green" d="M1494 438 C1435 438, 1410 437, 1359 437"/>
  <text x="1372" y="416" class="label">Heartbeat</text>

  <path class="flow-blue" d="M992 674 C1060 674, 1082 565, 1147 565"/>
  <text x="1017" y="611" class="label">路由后开 bi stream</text>
  <path class="flow-blue" d="M1359 565 C1412 565, 1435 499, 1494 499"/>

  <path class="flow-orange" d="M1494 677 C1430 677, 1410 704, 1359 704"/>
  <path class="flow-orange" d="M1147 704 C1080 704, 1055 690, 992 690"/>
  <text x="1018" y="790" class="label">响应头 + body chunk + end</text>

  <path class="flow-red" d="M992 718 C1062 780, 1082 834, 1147 834"/>
  <path class="flow-red" d="M1359 834 C1433 834, 1445 535, 1494 535"/>
  <text x="1007" y="815" class="label">Cancel 反向控制流</text>

  <path class="flow-blue" d="M1603 736 C1603 820, 1548 924, 1368 970"/>
  <text x="1432" y="924" class="label">HTTP upstream</text>
  <path class="flow-orange" d="M1280 970 C1455 925, 1572 820, 1572 736"/>

  <path class="flow-orange" d="M475 690 C390 690, 376 350, 328 350"/>
  <text x="366" y="384" class="label">JSON / SSE 回写</text>

  <text x="70" y="1136" class="section-label">关键特性</text>
  <text x="70" y="1166" class="panel-sub">mTLS 双向认证 · NAT 后主动连接 · 按模型路由 · admission control · SSE 流式透传 · 客户端断开自动取消上游</text>
</svg>
